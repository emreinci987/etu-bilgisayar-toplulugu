server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # gzip — metin tabanlı varlıkları sıkıştır
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # Temel güvenlik header'ları
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Vite'ın hash'lediği statik asset'ler (JS/CSS/font) — agresif, immutable cache
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # public/ altından kopyalanan medya (logolar, etkinlik ve ekip fotoğrafları)
    # Dosya adları hash'siz olduğu için daha kısa cache + yeniden doğrulama
    location ~* ^/(logolar|etkinlikler|ekip)/ {
        expires 7d;
        add_header Cache-Control "public, must-revalidate";
        try_files $uri =404;
    }

    # index.html her istekte yeniden doğrulanır (yeni deploy anında görünür)
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # SPA fallback — bilinmeyen yolları React Router'a devret
    location / {
        try_files $uri $uri/ /index.html;
    }
}
